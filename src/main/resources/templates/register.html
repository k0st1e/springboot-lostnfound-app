<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link th:href="@{/css/stylesheet.css}" rel="stylesheet"/>
    <link th:href="@{/images/search-rel.png}" rel="icon">
</head>

<body>
<main class="home-content">
    <h1>Did you lose or find something?</h1>

    <br>
    <br>

    <h2>You're at the right place📍</h2>

    <br>
    <br>

    <h2>Register Below!</h2>

    <br>
    <br>

    <div class="form-container">
        <form method="post" th:action="@{/doregister}" th:object="${registerDTO}">

            <label>
                <input type="text" name="username" class="login-inputfield" placeholder="Username" tabindex="1">
            </label>

            <label>
                <input type="text" name="realname" class="login-inputfield" placeholder="Real Name" tabindex="2">
            </label>

            <label>
                <input type="password" name="password" class="login-inputfield" placeholder="Password" tabindex="3">
            </label>

            <label>
                <input type="password" name="confirmpassword" class="login-inputfield" placeholder="Confirm Password" tabindex="4">
            </label>

            <input type="submit" class="submit-button" value="Register!" tabindex="5">

        </form>

        <!-- Throws message when Registration of a user fails -->
        <p class="error-notification-area" th:text="${message}"></p>

    </div>

</main>

<footer class="footer">
    <p>Konstantinos Giasemis, 2026.</p>
</footer>
</body>

</html>
