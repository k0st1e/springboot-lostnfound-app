<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit your item!</title>
  <link th:href="@{/css/stylesheet.css}" rel="stylesheet"/>
  <link th:href="@{/images/search-rel.png}" rel="icon">
</head>

<body>
<header>
  <nav id="top">
    <ul class="nav-flex-container">
      <li><a href="/home">Home</a></li>
      <li class="active_page"><a href="/choose">Submit Item</a></li>
      <li><a href="/dash">Dash Analytics</a></li>
      <!-- @ModelAttribute("hasUnreadAlerts") from `GlobalAlertDevice` :) -->
      <li th:classappend="${hasUnreadAlerts} ? ' ugotmail' : ''"><a href="/alerts">Alerts</a></li>
    </ul>
  </nav>
</header>

<main class="page-layout">

  <div class="item-card">
    <form method="post" enctype="multipart/form-data" th:action="@{/doitemsubmit}">

      <!-- Take the status from the bar to have it in the form. Kinda weird but whatever. -->
      <input type="hidden" name="status" th:value="${param.status}">

      <label>
        <input type="text" name="itemname" class="inputfield" placeholder="Item Name">
      </label>

      <label>
        <input type="text" name="itemdescription" class="inputfield" placeholder="Item Description">
      </label>

      <label>
        <input type="text" name="itemlocation" class="inputfield" placeholder="Municipality">
      </label>

      <label>
        <input type="text" name="itemcontact" class="inputfield" placeholder="Contact Phone">
      </label>

      <label>
        <select name="categoryId" id="category" class="inputfield" required>
          <option value="">Choose Category</option>

          <option th:each="category : ${categories}"
                  th:value="${category.categoryid}"
                  th:text="${category.categoryname}">
          </option>
        </select>
      </label>

      <label for="fileblob" class="file-label">
        Choose Image
      </label>

      <input type="file" name="fileblob" id="fileblob" class="file-input">

      <input type="submit" name="usersubmit" class="submit-button-item" value="Submit">

    </form>

    <p class="error-notification-area" th:text="${message}"></p>

  </div>
</main>

<footer class="footer">
  <p>Konstantinos Giasemis, 2026.</p>
</footer>
</body>

</html>
